<sly data-sly-use.model="com.mvw.core.models.PageHeroModel">
  <sly data-sly-use.tpl="/apps/mvw/components/tmvc/components/placeHolder.html" />
  <sly data-sly-call="${tpl.placeHolderBlock @
        title='Configure Component',
        content='Please open the dialog and configure the settings.'
    }" />
  <div
    class="page-hero-cmp bg-theme-${model.copySectionBgColor @ context='text'}  m-${model.backgroundImage ? model.mobileBgColorBorderControl : 'none'}  ${model.backgroundImage ? model.copySectionBgBorderControl : ''} ${model.copySectionAlignment} ${model.backgroundImage ? '' : 'no-bg'}"
    hero-svg-color="${model.copySectionBgColor}" hero-m-svg-color="${model.mobileBgColor}"
    style="--desktop-opacity: ${model.backgroundTransControl || '0.9' @ context='styleToken'}; --mobile-opacity: ${model.mobileBackgroundTransControl || '0.9' @ context='styleToken'}; ">
    <div class="grid-container page-hero-container  ">
      <div class="page-hero-content">
        <div class="page-hero-content-section">
          <h1
            class="${model.shortDescription ? 'cmp-title' : ''} heading1 align-${model.headlineAlignment} m-align-${model.mobileHeadlineAlignment}">
            ${model.headlineText @ context ='html'}</h1>
          <sly data-sly-test="${model.shortDescription}">
            <div class="hero__description">
              ${model.shortDescription @ context='html'}
            </div>
          </sly>

        </div>
      </div>
    </div>
    <sly data-sly-test="${model.backgroundImage}">
      <div class="page-hero-image" data-cmp-hook-hero="bgImage" style="background-image: url('${model.backgroundImage @ context='uri'}'); 
                 background-position: ${model.bgPositionLeftAndRight @ context='number'}% ${model.bgPositionTopAndBottom @ context='number'}%;
                 background-size: cover;">
        <img src="${model.backgroundImage @ context='uri'}" loading="eager" fetchpriority="high" alt="${model.headlineText @ context='text'}"
          data-cmp-hook-hero="bgImageElement" aria-hidden="true" hidden />
      </div>
      <sly data-sly-test="${model.mobileBackgroundImage}">
        <div class="page-hero-image-mobile" data-cmp-hook-hero="bgImage" style="background-image: url('${model.mobileBackgroundImage @ context='uri'}');
                   background-position: ${model.mobileBgPositionLeftAndRight @ context='number'}% ${model.mobileBgPositionTopAndBottom @ context='number'}%;
                   background-size: cover;">
          <img src="${model.mobileBackgroundImage @ context='uri'}" loading="eager" fetchpriority="high" alt="${model.headlineText @ context='text'}"
            data-cmp-hook-hero="bgImageElement" aria-hidden="true" hidden />
        </div>
      </sly>
    </sly>
    <svg class="hero__bg-shape_convex" viewBox="0 0 1440 516" preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg">
      <clipPath id="clip-convex" clipPathUnits="userSpaceOnUse">
        <rect x="0" y="0" width="1440" height="516" />
      </clipPath>
      <g clip-path="url(#clip-convex)">
        <path d="M635,259c-0.14-91.84,27.04-181.65,78.09-258H0v516h713.09C662.04,440.65,634.86,350.84,635,259z"
          fill="var(--hero-svg-color)" />
      </g>
    </svg>
    <svg class="hero__bg-shape_concave" viewBox="0 0 1440 516" preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg">
      <clipPath id="clip-concave" clipPathUnits="userSpaceOnUse">
        <rect x="0" y="0" width="1440" height="516" />
      </clipPath>
      <g clip-path="url(#clip-concave)">
        <path d="M1440,517H805.09C755.77,443.18,727,354.45,727,259s28.77-184.18,78.09-258H1440V517z"
          fill="var(--hero-svg-color)" />
      </g>
    </svg>
  </div>
</sly>
