<div class="resort-details-component" id="resortDetails">

    <div class="resort-details-wrapper">

        <!-- LEFT MEDIA (Video) -->
        <div class="resort-details-wrapper__top">
            <div class="media-main">
                <video class="resort-video" id="mainVideo" preload="metadata"
                    poster="/content/dam/new-club-brand-awareness/brand-awareness/Video-Thumbnail.png">
                    <source src="https://samplelib.com/lib/preview/mp4/sample-5s.mp4" type="video/mp4">
                    Your browser does not support HTML5 video.
                </video>
                <i class="fa-solid fa-circle-play video-play-btn"></i>
            </div>

            <!-- RIGHT MEDIA 2x2 GALLERY -->
            <div class="media-gallery">
                <div class="media-gallery__item">
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-1.png" class="resort-media__gallery-img"
                        alt="Gallery 1">
                </div>
                <div class="media-gallery__item">
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-2.png" class="resort-media__gallery-img"
                        alt="Gallery 2">
                </div>
                <div class="media-gallery__item">
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-3.png" class="resort-media__gallery-img"
                        alt="Gallery 3">
                </div>

                <div class="media-gallery__item media-gallery__item--cta">
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallery-4.png" class="resort-media__gallery-img"
                        alt="Gallery 4">
                    <button class="gallery__cta" type="button" aria-haspopup="dialog">View All Media</button>
                </div>
            </div>
        </div>

        <!-- MOBILE CAROUSEL -->
        <div class="resort-media-carousel mobile-only" aria-hidden="true">
            <!-- HEART ICON (written once) -->
            <i class="fa-regular fa-heart carousel-favourite"></i>

            <div class="carousel-track">
                <!-- Image slides follow (one per gallery image) -->
                <div class="carousel-item" data-type="image" data-index="1">
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-1.png" alt="1" />
                </div>
                <div class="carousel-item" data-type="image" data-index="2">
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-2.png" alt="2" />
                </div>
                <div class="carousel-item" data-type="image" data-index="3">
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-3.png" alt="3" />
                </div>
                <div class="carousel-item" data-type="image" data-index="4">
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallery-4.png" alt="4" />
                </div>
            </div>

            <button class="carousel-arrow left" aria-label="Previous">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button class="carousel-arrow right" aria-label="Next">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <!-- Add dots container -->
            <div class="carousel-dots"></div>
        </div>

        <!-- LEFT CONTENT -->
        <div class="resort-details-wrapper__bottom">
            <div class="resort-info">
                <div class="resort-info__header">
                    <div class="resort-info__title">Resort Name</div>

                    <div class="resort-info__rating__reviews">
                        <div class="resort-info__rating">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star-half"></i>
                        </div>
                        <span class="resort-info__reviews">999 reviews</span>
                    </div>
                </div>

                <div class="resort-info__desc">
                    Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod
                </div>

                <div class="resort-info__sub-desc">
                    Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod
                </div>
            </div>
            <div class="resort-details-wrapper__bottom__right resort-map-wrapper">
                <!-- Map placeholder for now -->
                  <sly data-sly-resource="${'googlemap' @ resourceType='mvw/components/newclub/googlemaps'}"/>

                <!-- <img src="/content/dam/newclub/resort-details/resort-map.png" alt="Map placeholder" class="resort-media__map" /> -->
            </div>
        </div>
    </div>
</div>


<!-- MEDIA MODAL -->
<div id="mediaModal" class="modal-overlay" role="dialog">
    <div class="media-modal__container">
        <div class="media-modal__wrapper">

            <!-- Close Button -->
            <span class="media-modal__close">×</span>

            <!-- Modal Title -->
            <h2 class="media-modal__title">Diamond Club™ Luxury Junior Suite</h2>
            <div class="media-modal__viewer">

                <!-- IMAGE -->
                <img id="mainModalImage" class="viewer-main-img" alt="MainViewer" />

                <!-- VIDEO -->
                <div class="modal-video-wrapper" id="modalVideoWrapper">
                    <video id="modalVideo" poster="/content/dam/new-club-brand-awareness/brand-awareness/Video-Thumbnail.png"
                        preload="metadata">
                        <source src="https://samplelib.com/lib/preview/mp4/sample-5s.mp4" type="video/mp4" />
                    </video>

                    <i class="fa-solid fa-circle-play modal-video-play-btn"></i>
                </div>
            </div>

            <!-- Caption -->
            <div class="media-modal__caption">This describes the image</div>

            <!-- Thumbnails + Arrows -->
            <div class="media-modal__thumb-row">

                <!-- LEFT ARROW -->
                <button class="thumb-arrow thumb-arrow--left" aria-label="Previous">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <!-- Thumbnail Strip -->
                <div class="media-modal__thumbnails">
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Video-Thumbnail.png" class="thumb" data-type="video"
                        data-poster="/content/dam/new-club-brand-awareness/brand-awareness/Video-Thumbnail.png"
                        data-video="https://samplelib.com/lib/preview/mp4/sample-5s.mp4" />

                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-1.png" class="thumb" data-type="image"
                        data-src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-1.png" />
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-2.png" class="thumb" data-type="image"
                        data-src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-2.png" />
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-3.png" class="thumb" data-type="image"
                        data-src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallerey-3.png" />
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallery-4.png" class="thumb"
                        data-type="image"
                        data-src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallery-4.png" />
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallery-4.png" class="thumb"
                        data-type="image"
                        data-src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallery-4.png" />
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallery-4.png" class="thumb"
                        data-type="image"
                        data-src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallery-4.png" />
                    <img src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallery-4.png" class="thumb"
                        data-type="image"
                        data-src="/content/dam/new-club-brand-awareness/brand-awareness/Resort-Gallery-4.png" />
                </div>

                <!-- RIGHT ARROW -->
                <button class="thumb-arrow thumb-arrow--right" aria-label="Next">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>
