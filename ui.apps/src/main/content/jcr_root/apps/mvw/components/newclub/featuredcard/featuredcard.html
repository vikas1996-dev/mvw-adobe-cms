<div data-sly-use.teaser="com.adobe.cq.wcm.core.components.models.Teaser"
     data-sly-use.btnModel="com.mvw.core.models.NewClubButtonModel"
     data-sly-use.templates="core/wcm/components/commons/v1/templates.html"
     data-sly-use.buttontemplates="mvw/components/newclub/templates.html"
     data-sly-use.imageTemplate="image.html"
     data-sly-use.pretitleTemplate="pretitle.html"
     data-sly-use.titleTemplate="title.html"
     data-sly-use.descriptionTemplate="description.html"
     data-sly-use.actionsTemplate="actions.html"
     data-sly-set.ctaHasData="${btnModel.buttonText || btnModel.iconClass}"
     data-sly-test.hasContent="${teaser.imageResource || teaser.pretitle || teaser.title || teaser.description || teaser.actions.size > 0}"
     id="${teaser.id}"
     class="cmp-teaser cmp-teaser--no-separator${!wcmmode.disabled && teaser.imageResource ? ' cq-dd-image' : ''}"
     data-cmp-data-layer="${teaser.data.json}">
    <a class="cmp-teaser__link${properties.thirdParty ? ' third-party-link' : ''}"
       data-sly-attribute="${teaser.link.htmlAttributes}"
       data-sly-unwrap="${!teaser.link.valid || !teaser.actions.empty || !(teaser.pretitle || teaser.title || teaser.description)}"
       data-cmp-clickable="${teaser.data ? true : false}">
        <sly data-sly-call="${imageTemplate.image @ teaser=teaser}"></sly>
        <div class="cmp-teaser__content">
            <sly data-sly-call="${pretitleTemplate.pretitle @ teaser=teaser}"></sly>
            <sly data-sly-call="${titleTemplate.title @ teaser=teaser}"></sly>
            <sly data-sly-call="${descriptionTemplate.description @ teaser=teaser}"></sly>
            <sly data-sly-test="${ctaHasData && !btnModel.buttonHide}">
                <div class="cta button--mobile">
                    <sly data-sly-call="${buttontemplates.button @ label=btnModel.buttonText, href=btnModel.buttonLink,
                            target=btnModel.opensIn, ariaLabel=btnModel.buttonText, size ='cmp-button--small', external=btnModel.thirdParty}" />
                </div>
                <div class="cta button--desktop">
                    <sly data-sly-call="${buttontemplates.button @ label=btnModel.buttonText, href=btnModel.buttonLink,
                            target= btnModel.opensIn, ariaLabel=btnModel.buttonText, size='cmp-button--large', external=btnModel.thirdParty}" />
                </div>
            </sly>
        </div>
    </a>
</div>
<sly data-sly-call="${templates.placeholder @ isEmpty=!hasContent, classAppend='cmp-teaser'}"></sly>
