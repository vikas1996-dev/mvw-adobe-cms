<sly data-sly-use.contents="com.mvw.core.models.StaticContentModel">
    <sly data-sly-test="${contents.propertiesList}">
        <sly data-sly-list.content="${contents.propertiesList}">
            <sly data-sly-test="${content.nodename == 'discover-your-next-vacation-header'}">
                <sly data-sly-set.header="${content.properties}" />
            </sly>
            <sly data-sly-test="${content.nodename == 'view-all-resorts-label'}">
                <sly data-sly-set.allResorts="${content.properties}" />
            </sly>
            <sly data-sly-test="${content.nodename == 'browse-vacation-types-label'}">
                <sly data-sly-set.vacationTypesLabel="${content.properties}" />
            </sly>
            <sly data-sly-test="${content.nodename == 'browse-regions-label'}">
                <sly data-sly-set.regionsLabel="${content.properties}" />
            </sly>
<sly data-sly-test="${content.nodename == 'address-icon'}">
        <sly data-sly-set.locationIcon="${content.properties  @ context='html'}" />
      </sly>
      <sly data-sly-test="${content.nodename == 'extend-ownership-icon'}">
        <sly data-sly-set.extendownershipIcon=" ${content.properties}" />
      </sly>
        </sly>
    </sly>
</sly>

<div class="grid-container">
    <!-- Hero Section -->
    <div class="hero-section col-12">
        <h1 class="hero-title">${header}</h1>
    </div>

    <!-- Tabs Navigation -->
    <div class="tabs-container col-12">
        <nav class="tabs-nav" role="tablist" aria-label="Browse destinations">
            <button class="tab-button active" role="tab" aria-selected="true" aria-controls="regions-panel" id="regions-tab" data-tab="regions">
                        <i class="fa-light ${locationIcon}" aria-hidden="true"></i>
                        <span>${regionsLabel}</span>
                    </button>
            <button class="tab-button" role="tab" aria-selected="false" aria-controls="vacation-types-panel" id="vacation-types-tab" data-tab="vacation-types">
                        <i class="fa-light ${extendownershipIcon}" aria-hidden="true"></i>
                        <span>${vacationTypesLabel}</span>
                    </button>
        </nav>
    </div>

    <!-- Tab Panels -->
    <div class="tab-content col-12">
        <!-- Loading Spinner -->
        <div class="loading-spinner" style="display: block;" aria-hidden="false">
            <div class="spinner"></div>
            <p>Loading destinations...</p>
        </div>

        <!-- Error Message -->
        <div class="error-message" style="display: none;" role="alert"></div>

        <!-- Browse Regions Panel -->
        <div class="tab-panel active" role="tabpanel" id="regions-panel" aria-labelledby="regions-tab">
            <!-- Region Filter Pills -->
            <div class="filter-pills-container">
                <div class="filter-pills">
                    <!-- Pills will be dynamically generated -->
                </div>
            </div>

            <!-- Destination Cards Grid -->
            <div class="cards-grid destination-cards" role="list" aria-label="Destination cards">
                <!-- Cards will be dynamically generated -->
            </div>

            <!-- Special Offer Card -->
            <div class="special-offer-container">
                <!-- Special offer will be dynamically generated -->
            </div>

            <!-- View All Button -->
            <div class="view-all-container">
                <button class="btn-view-all" aria-label="View all resorts">
                            ${allResorts}
                        </button>
            </div>
        </div>

        <!-- Browse Vacation Types Panel -->
        <div class="tab-panel" role="tabpanel" id="vacation-types-panel" aria-labelledby="vacation-types-tab" hidden>
            <div class="cards-grid vacation-type-cards" role="list" aria-label="Vacation type cards">
                <!-- Cards will be dynamically generated -->
            </div>
        </div>
    </div>
</div>
<section class="featured-resorts-section" aria-labelledby="featured-resorts-title" style="display: none;">
            <h2 class="section-title" id="featured-resorts-title">Featured Resorts</h2>
            <div class="featured-resorts-carousel" data-mod="editorial-carousel" data-loop="true">
                <div class="editorial-slides" role="list" aria-label="Featured resorts carousel">
                    <!-- Resort cards will be dynamically generated -->
                </div>
                <div class="nav-icons">
                    <button class="nav-icon-left" aria-label="Previous resort">
                        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                    </button>
                    <div class="current-slide" aria-live="polite" aria-atomic="true">1 / 6</div>
                    <button class="nav-icon-right" aria-label="Next resort">
                        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </section>
